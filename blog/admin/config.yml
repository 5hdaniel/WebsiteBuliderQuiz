backend:
  name: github
  repo: 5hdaniel/WebsiteBuliderQuiz # Your GitHub username/repo
  branch: main # Or your main branch name
  base_url: https://api.vercel.com
  auth_endpoint: /v1/integrations/deploy/prj_BeBkQBX2bEfY9dqY6ZDGwPKg/oauth/github # Will be updated after Vercel setup

# Uncomment below for local development/testing
# local_backend: true

media_folder: "blog/images/uploads" # Where uploaded images will be stored
public_folder: "/images/uploads" # Public URL path for images

collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog Posts" # Used in the UI
    folder: "blog/posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., post-title.md
    fields: # The fields for each document
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", default: "John Doe"}
      - {label: "Featured Image", name: "featured_image", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Category", name: "category", widget: "select", options: ["Web Design", "Development", "Tutorials", "Tips & Tricks"]}

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "blog/content/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Author Name", name: "author_name", widget: "string"}
          - {label: "Author Photo", name: "author_photo", widget: "image"}
          - {label: "Author Bio", name: "author_bio", widget: "text"}
          - {label: "Author Email", name: "author_email", widget: "string"}

      - label: "Site Settings"
        name: "settings"
        file: "blog/content/settings.md"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Site Description", name: "site_description", widget: "text"}
          - {label: "Twitter Handle", name: "twitter", widget: "string", required: false}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - {label: "Bluesky Handle", name: "bluesky", widget: "string", required: false}
